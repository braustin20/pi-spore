# pi-spore's own actions (ADR 0027). Pipelines and runs use check and test as gates.

[actions.setup]
run = ["npm", "ci"]
description = "Install dependencies in a new copy"

[actions.check]
run = ["npm", "run", "check"]
description = "Biome, then tsc -b"

# Some tests compare the env a child gets, so the PI_SPORE_* names an action or an agent adds must not leak in.
[actions.test]
run = [
  "env",
  "-u", "PI_SPORE_WORKSPACE_ID",
  "-u", "PI_SPORE_WORKSPACE_PATH",
  "-u", "PI_SPORE_PROJECT_ROOT",
  "-u", "PI_SPORE_AGENT_ID",
  "-u", "PI_SPORE_CHAT_KIND",
  "-u", "PI_SPORE_URL",
  "-u", "PI_SPORE_TOKEN",
  "-u", "PI_SPORE_SERVER_PID",
  "npm", "test",
]
description = "Vitest"
exclusive = true

# A test server for agents that work on pi-spore: it builds, then runs on a temp PI_SPORE_HOME and a free port
# (printed in the log), with the real server's PI_SPORE_URL, PI_SPORE_TOKEN, and PI_SPORE_SERVER_PID removed.
# Start it with run_action { name: "dev", background: true } and stop it with stop_action.
[actions.dev]
run = ["node", "scripts/dev-server.mjs"]
description = "Build, then run a throwaway server on a temp home and a free port"
