# pi-spore's own actions (ADR 0027). Pipelines and runs use check and test as gates.

[actions.setup]
run = ["npm", "ci"]
description = "Install dependencies in a new copy"

[actions.check]
run = ["npm", "run", "check"]
description = "Biome, then tsc -b"

# Some tests compare the env a child gets, so the PI_SPORE_* names an action or an agent adds must not leak in.
[actions.test]
run = [
  "env",
  "-u", "PI_SPORE_WORKSPACE_ID",
  "-u", "PI_SPORE_WORKSPACE_PATH",
  "-u", "PI_SPORE_PROJECT_ROOT",
  "-u", "PI_SPORE_AGENT_ID",
  "-u", "PI_SPORE_CHAT_KIND",
  "-u", "PI_SPORE_URL",
  "-u", "PI_SPORE_TOKEN",
  "-u", "PI_SPORE_SERVER_PID",
  "npm", "test",
]
description = "Vitest"
exclusive = true

# A workspace's own server, for the user (Run, then Open in the Actions panel) and for agents (ADR 0161). It builds,
# then runs on <worktree>/.pi-spore-dev/home, kept between runs, and a free port (printed in the log), without the
# real server's PI_SPORE_URL, PI_SPORE_TOKEN, and PI_SPORE_SERVER_PID. Agents start it with
# run_action { name: "dev", background: true } and stop it with stop_action.
[actions.dev]
run = ["node", "scripts/dev-server.mjs"]
description = "Build, then run this workspace's server on a free port (delete .pi-spore-dev/ to reset)"
